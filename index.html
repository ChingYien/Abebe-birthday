<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise ❤️</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    height: 100vh;
    overflow: hidden;
}

h1 {
    margin-top: 100px;
    color: white;
}

h2 {
    margin-top: 30px;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    position: absolute;
}

#yesBtn {
    left: 10%;
    top: 40%;
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    left: 10%;
    top: 70%;
    background-color: #f44336;
    color: white;
}
</style>
</head>

<body>

<h1>Happy Birthday Bebb 🎂</h1>
<h2>Do you want to see your birthday surprise? 🎂</h2>

<img src="photo.jpg" alt="Our Memory ❤️">

<button id="yesBtn">YES YOU WANT💖 I KNOW THAT YOU WANT</button>
<button id="noBtn">DONT CLICK NO 😜 NO WAY, HOW DARE YOU</button>

<script>
let noClickCount = 0;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

// Move NO button when hover
noBtn.addEventListener("mouseover", () => {
    if (noClickCount < 3) {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        noClickCount++;
    } else {
        noBtn.innerText = "Okay okay...cuba la ni click YES";
    }
});

// YES button click → go to video page
yesBtn.addEventListener("click", () => {
    window.location.href = "video.html";
});
</script>

</body>
</html>
